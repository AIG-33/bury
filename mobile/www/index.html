<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>PlayTennis.by</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f6f9f4;
        color: #14321f;
        text-align: center;
      }
      .card {
        max-width: 320px;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: #1f8a4c;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: 700;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 24px;
        color: #4a5d4f;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: #1f8a4c;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        padding: 14px 24px;
        width: 100%;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">PT</div>
      <h1>Нет соединения</h1>
      <p>
        Не удалось загрузить PlayTennis.by. Проверьте подключение к интернету и
        попробуйте снова.
      </p>
      <button onclick="window.location.reload()">Повторить</button>
    </div>
  </body>
</html>
